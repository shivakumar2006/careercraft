<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerCraft — Shivakumar2006 × Visa Inc.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --bg2: #0f0f1a;
      --bg3: #141420;
      --bg4: #1a1a2e;
      --accent: #7c6ef7;
      --accent2: #9d92f9;
      --accent3: #5a4de0;
      --green: #1ddf8a;
      --green2: #15b870;
      --red: #f76e6e;
      --yellow: #f7c56e;
      --text: #e8e8f0;
      --text2: #a0a0b8;
      --text3: #6060808;
      --border: #1e1e32;
      --border2: #2a2a42;
      --card: #0f0f1a;
      --radius: 16px;
      --radius2: 12px;
      --radius3: 8px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg2);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent3);
      border-radius: 3px;
    }

    /* ──────────────── NAVBAR ──────────────── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span {
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text2);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
      background: var(--border);
    }

    .nav-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    /* ──────────────── LAYOUT ──────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 80px 0;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .section-sub {
      color: var(--text2);
      font-size: 1rem;
      max-width: 560px;
    }

    /* ──────────────── HERO ──────────────── */
    #hero {
      padding-top: 120px;
      padding-bottom: 100px;
      position: relative;
      overflow: hidden;
    }

    #hero::before {
      content: '';
      position: absolute;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124, 110, 247, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    #hero::after {
      content: '';
      position: absolute;
      bottom: -200px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(29, 223, 138, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 60px;
      align-items: center;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .hero-eyebrow-badge {
      background: rgba(124, 110, 247, 0.15);
      border: 1px solid rgba(124, 110, 247, 0.3);
      color: var(--accent2);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .hero-eyebrow-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.3);
      }
    }

    .hero-title {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero-title .highlight {
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      color: var(--text2);
      font-size: 1.05rem;
      margin-bottom: 32px;
      max-width: 500px;
      line-height: 1.7;
    }

    .hero-meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .hero-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--text2);
    }

    .hero-meta-item .icon {
      font-size: 1rem;
    }

    .hero-meta-item strong {
      color: var(--text);
      font-weight: 600;
    }

    .hero-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text2);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .tag:hover {
      border-color: var(--accent);
      color: var(--accent2);
    }

    .tag.go {
      border-color: rgba(29, 223, 138, 0.3);
      color: var(--green);
      background: rgba(29, 223, 138, 0.05);
    }

    .tag.js {
      border-color: rgba(247, 197, 110, 0.3);
      color: var(--yellow);
      background: rgba(247, 197, 110, 0.05);
    }

    .tag.ts {
      border-color: rgba(124, 110, 247, 0.3);
      color: var(--accent2);
      background: rgba(124, 110, 247, 0.05);
    }

    .tag.html {
      border-color: rgba(247, 110, 110, 0.3);
      color: var(--red);
      background: rgba(247, 110, 110, 0.05);
    }

    /* ──────────────── SCORE RING ──────────────── */
    .score-ring-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .score-ring-container {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .score-ring-svg {
      width: 220px;
      height: 220px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--border2);
      stroke-width: 12;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 565.5;
      stroke-dashoffset: 565.5;
      transition: stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .score-ring-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      display: block;
    }

    .score-denom {
      font-size: 0.85rem;
      color: var(--text2);
      font-weight: 500;
    }

    .score-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text2);
      font-weight: 600;
      margin-top: 4px;
    }

    .score-verdict {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius2);
      padding: 12px 20px;
      text-align: center;
      max-width: 220px;
    }

    .score-verdict p {
      font-size: 0.78rem;
      color: var(--text2);
      line-height: 1.5;
    }

    .score-verdict strong {
      color: var(--yellow);
    }

    /* ──────────────── SCORE BREAKDOWN ──────────────── */
    #skills {
      background: var(--bg2);
    }

    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 48px;
    }

    .skill-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: all 0.3s;
    }

    .skill-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124, 110, 247, 0.08);
    }

    .skill-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
    }

    .skill-card-left {
      flex: 1;
    }

    .skill-name {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .skill-meta {
      font-size: 0.75rem;
      color: var(--text2);
    }

    .skill-weight {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--bg4);
      border: 1px solid var(--border2);
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--text2);
      white-space: nowrap;
    }

    .skill-bar-track {
      background: var(--bg4);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .skill-bar-fill {
      height: 100%;
      border-radius: 4px;
      width: 0;
      transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .skill-bar-fill.high {
      background: linear-gradient(90deg, var(--green2), var(--green));
    }

    .skill-bar-fill.mid {
      background: linear-gradient(90deg, var(--accent3), var(--accent));
    }

    .skill-bar-fill.low {
      background: linear-gradient(90deg, #c04020, var(--red));
    }

    .skill-bar-fill.yellow {
      background: linear-gradient(90deg, #c09020, var(--yellow));
    }

    .skill-score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skill-raw {
      font-size: 0.8rem;
      color: var(--text2);
    }

    .skill-weighted {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .skill-weighted.high {
      color: var(--green);
    }

    .skill-weighted.mid {
      color: var(--accent2);
    }

    .skill-weighted.low {
      color: var(--red);
    }

    .skill-weighted.yellow {
      color: var(--yellow);
    }

    /* ──────────────── MATCHED SKILLS ──────────────── */
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 48px;
    }

    .match-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }

    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .match-card.strong::before {
      background: linear-gradient(90deg, var(--green2), var(--green));
    }

    .match-card.partial::before {
      background: linear-gradient(90deg, var(--accent3), var(--accent));
    }

    .match-card.gap::before {
      background: linear-gradient(90deg, #c04020, var(--red));
    }

    .match-card:hover {
      border-color: var(--border2);
      transform: translateY(-2px);
    }

    .match-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .match-card-badge.strong {
      background: rgba(29, 223, 138, 0.1);
      color: var(--green);
      border: 1px solid rgba(29, 223, 138, 0.2);
    }

    .match-card-badge.partial {
      background: rgba(124, 110, 247, 0.1);
      color: var(--accent2);
      border: 1px solid rgba(124, 110, 247, 0.2);
    }

    .match-card-badge.gap {
      background: rgba(247, 110, 110, 0.1);
      color: var(--red);
      border: 1px solid rgba(247, 110, 110, 0.2);
    }

    .match-card h4 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .match-card p {
      font-size: 0.85rem;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .match-card-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--bg4);
      border: 1px solid var(--border2);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      color: var(--text2);
      font-family: 'Courier New', monospace;
    }

    /* ──────────────── PREP CHECKLIST ──────────────── */
    #checklist {
      background: var(--bg);
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 48px;
    }

    .week-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.3s;
    }

    .week-card:hover {
      border-color: var(--border2);
    }

    .week-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .week-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .week-icon.w1 {
      background: rgba(29, 223, 138, 0.1);
    }

    .week-icon.w2 {
      background: rgba(124, 110, 247, 0.1);
    }

    .week-icon.w3 {
      background: rgba(247, 197, 110, 0.1);
    }

    .week-icon.w4 {
      background: rgba(247, 110, 110, 0.1);
    }

    .week-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .week-sub {
      font-size: 0.75rem;
      color: var(--text2);
      font-weight: 500;
    }

    .week-progress-bar {
      height: 3px;
      background: var(--border);
    }

    .week-progress-fill {
      height: 100%;
      transition: width 0.5s ease;
    }

    .w1 .week-progress-fill {
      background: var(--green);
    }

    .w2 .week-progress-fill {
      background: var(--accent);
    }

    .w3 .week-progress-fill {
      background: var(--yellow);
    }

    .w4 .week-progress-fill {
      background: var(--red);
    }

    .week-tasks {
      padding: 16px 24px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 6px;
      padding-left: 6px;
      margin: 0 -6px;
      padding-right: 6px;
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-item:hover {
      background: var(--bg4);
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .task-checkbox.checked {
      background: var(--green);
      border-color: var(--green);
    }

    .task-checkbox.checked::after {
      content: '✓';
      color: #0a0a0f;
      font-size: 0.65rem;
      font-weight: 900;
    }

    .task-text {
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text);
      transition: all 0.2s;
      flex: 1;
    }

    .task-text.done {
      color: var(--text2);
      text-decoration: line-through;
      text-decoration-color: var(--text2);
    }

    .task-difficulty {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .difficulty-easy {
      background: rgba(29, 223, 138, 0.1);
      color: var(--green);
    }

    .difficulty-med {
      background: rgba(247, 197, 110, 0.1);
      color: var(--yellow);
    }

    .difficulty-hard {
      background: rgba(247, 110, 110, 0.1);
      color: var(--red);
    }

    .week-footer {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .week-footer-count {
      font-size: 0.78rem;
      color: var(--text2);
    }

    .week-footer-count span {
      font-weight: 700;
      color: var(--text);
    }

    .btn-clear {
      background: none;
      border: 1px solid var(--border2);
      color: var(--text2);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-clear:hover {
      border-color: var(--accent);
      color: var(--accent2);
    }

    .checklist-summary {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .summary-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-stat-num {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--accent2);
      line-height: 1;
    }

    .summary-stat-label {
      font-size: 0.75rem;
      color: var(--text2);
      font-weight: 500;
    }

    .summary-divider {
      width: 1px;
      height: 48px;
      background: var(--border2);
    }

    .overall-bar-track {
      flex: 1;
      min-width: 200px;
    }

    .overall-bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--text2);
    }

    .overall-bar-label span {
      font-weight: 700;
      color: var(--accent2);
    }

    .overall-bar {
      background: var(--bg4);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .overall-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent3), var(--accent), var(--green));
      border-radius: 5px;
      transition: width 0.5s ease;
    }

    /* ──────────────── INTERVIEW ACCORDION ──────────────── */
    #interview {
      background: var(--bg2);
    }

    .accordion {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .accordion-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      overflow: hidden;
      transition: all 0.3s;
    }

    .accordion-item.open {
      border-color: var(--accent);
    }

    .accordion-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
