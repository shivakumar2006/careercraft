<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerCraft — Visa Inc. Dashboard | Shivakumar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --bg3: #13131f;
    --card: #16162a;
    --card2: #1c1c35;
    --border: #2a2a4a;
    --accent: #6366f1;
    --accent2: #818cf8;
    --accent3: #4f46e5;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--accent3); border-radius: 3px; }

  /* ─── ANIMATED BG ─── */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  .bg-glow {
    position: fixed; z-index: 0; border-radius: 50%; filter: blur(120px); pointer-events: none;
  }
  .bg-glow-1 { width: 600px; height: 600px; background: rgba(99,102,241,0.08); top: -200px; right: -200px; }
  .bg-glow-2 { width: 500px; height: 500px; background: rgba(79,70,229,0.06); bottom: 10%; left: -150px; }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .nav-brand {
    display: flex; align-items: center; gap: 0.5rem;
    font-weight: 800; font-size: 1rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .nav-brand svg { flex-shrink: 0; }

  .nav-links {
    display: flex; align-items: center; gap: 0.25rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--text2); text-decoration: none; font-size: 0.8rem; font-weight: 500;
    padding: 0.4rem 0.75rem; border-radius: 6px;
    transition: all 0.2s;
  }
  .nav-links a:hover { color: var(--text); background: var(--card2); }

  .nav-score {
    background: linear-gradient(135deg, var(--accent3), var(--accent));
    color: white; font-weight: 700; font-size: 0.8rem;
    padding: 0.35rem 0.9rem; border-radius: 20px;
  }

  /* ─── MAIN LAYOUT ─── */
  main {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: 80px 1.5rem 4rem;
  }

  section { margin-bottom: 5rem; }

  .section-label {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--accent2);
    background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2);
    padding: 0.3rem 0.8rem; border-radius: 20px; margin-bottom: 1rem;
  }

  .section-title {
    font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #fff 0%, var(--text2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .section-sub { color: var(--text2); font-size: 0.9rem; margin-bottom: 2rem; }

  /* ─── CARDS ─── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
  }
  .card:hover {
    border-color: rgba(99,102,241,0.4);
    transform: translateY(-2px);
    box-shadow: 0 20px 60px rgba(99,102,241,0.1);
  }

  /* ─── HEADER SECTION ─── */
  .hero {
    display: grid; grid-template-columns: 1fr auto;
    gap: 2rem; align-items: start;
    padding: 2.5rem;
    background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
    border: 1px solid var(--border);
    border-radius: 24px;
    position: relative; overflow: hidden;
    margin-bottom: 5rem;
  }

  .hero::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.72rem; font-weight: 600;
    color: var(--accent2); background: rgba(99,102,241,0.1);
    border: 1px solid rgba(99,102,241,0.25);
    padding: 0.3rem 0.75rem; border-radius: 20px; margin-bottom: 1rem;
  }

  .hero-badge span { width: 6px; height: 6px; background: var(--accent2); border-radius: 50%; display: block; animation: pulse 2s infinite; }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.4)} }

  .hero h1 {
    font-size: clamp(1.6rem, 4vw, 2.5rem); font-weight: 900;
    line-height: 1.1; margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #fff, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .hero-company {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .company-logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #1a1aff, #0041a8);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.75rem; color: #fff;
    flex-shrink: 0;
  }

  .hero-company span { color: var(--text2); font-size: 1rem; font-weight: 500; }

  .hero-desc {
    color: var(--text2); font-size: 0.9rem; line-height: 1.6;
    max-width: 600px;
    background: rgba(99,102,241,0.05); border-left: 3px solid var(--accent);
    padding: 0.75rem 1rem; border-radius: 0 8px 8px 0;
  }

  /* Score Circle */
  .score-widget {
    display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    flex-shrink: 0;
  }

  .score-ring {
    position: relative; width: 140px; height: 140px;
  }

  .score-ring svg { transform: rotate(-90deg); }

  .score-ring-track { fill: none; stroke: var(--border); stroke-width: 8; }
  .score-ring-fill {
    fill: none; stroke: url(#scoreGrad); stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 339.3;
    stroke-dashoffset: 339.3;
    transition: stroke-dashoffset 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .score-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .score-number {
    font-size: 2.2rem; font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1;
  }

  .score-denom { font-size: 0.7rem; color: var(--text3); font-weight: 600; }
  .score-label { font-size: 0.75rem; color: var(--text2); font-weight: 600; text-align: center; }

  .match-tag {
    background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
    color: var(--green); font-size: 0.7rem; font-weight: 700;
    padding: 0.25rem 0.65rem; border-radius: 20px;
  }

  /* ─── SKILL BARS ─── */
  .skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

  @media (max-width: 640px) { .skill-grid { grid-template-columns: 1fr; } }

  .skill-item { display: flex; flex-direction: column; gap: 0.5rem; }

  .skill-header { display: flex; align-items: center; justify-content: space-between; }

  .skill-name { font-size: 0.85rem; font-weight: 600; color: var(--text); }

  .skill-meta { display: flex; align-items: center; gap: 0.5rem; }

  .skill-score { font-size: 0.8rem; font-weight: 700; color: var(--accent2); }

  .skill-weight { font-size: 0.7rem; color: var(--text3); }

  .skill-bar-bg {
    height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden;
    position: relative;
  }

  .skill-bar-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
    width: 0; transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .skill-bar-fill::after {
    content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 10px var(--accent);
  }

  .skill-bar-fill.green { background: linear-gradient(90deg, #16a34a, var(--green)); }
  .skill-bar-fill.green::after { background: var(--green); box-shadow: 0 0 10px var(--green); }

  .skill-bar-fill.yellow { background: linear-gradient(90deg, #a16207, var(--yellow)); }
  .skill-bar-fill.yellow::after { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }

  .skill-bar-fill.red { background: linear-gradient(90deg, #b91c1c, var(--red)); }
  .skill-bar-fill.red::after { background: var(--red); box-shadow: 0 0 10px var(--red); }

  /* Gap badges */
  .gap-section { margin-top: 2rem; }

  .gap-title {
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 1rem;
    display: flex; align-items: center; gap: 0.5rem;
  }

  .gap-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; }

  .gap-tag {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.78rem; font-weight: 500;
    padding: 0.35rem 0.8rem; border-radius: 20px;
    border: 1px solid;
  }

  .gap-tag.critical { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.25); color: #fca5a5; }
  .gap-tag.important { background: rgba(234,179,8,0.08); border-color: rgba(234,179,8,0.25); color: #fde68a; }
  .gap-tag.minor { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.25); color: var(--accent2); }

  /* ─── PREP PLAN ─── */
  .week-tabs {
    display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .week-tab {
    padding: 0.5rem 1.2rem; border-radius: 10px;
    font-size: 0.82rem; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--card); color: var(--text2);
    cursor: pointer; transition: all 0.2s;
  }

  .week-tab:hover { border-color: var(--accent); color: var(--text); }
  .week-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .week-panel { display: none; animation: fadeUp 0.3s ease; }
  .week-panel.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .week-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .week-title { font-size: 1rem; font-weight: 700; }
  .week-goal {
    font-size: 0.78rem; color: var(--text2); line-height: 1.5;
    background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.15);
    padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1.25rem;
  }
  .week-goal strong { color: var(--accent2); }

  .week-progress {
    display: flex; align-items: center; gap: 0.75rem;
  }

  .week-progress-bar { flex: 1; height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
  .week-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent3), var(--accent2)); border-radius: 3px; transition: width 0.5s ease; }
  .week-progress-text { font-size: 0.75rem; font-weight: 600; color: var(--accent2); white-space: nowrap; }

  .task-list { display: flex; flex-direction: column; gap: 0.75rem; }

  .task-item {
    display: flex; align-items: flex-start; gap: 1rem;
    padding: 1rem 1.25rem;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; cursor: pointer;
    transition: all 0.2s; user-select: none;
  }

  .task-item:hover { border-color: rgba(99,102,241,0.3); background: var(--card2); }
  .task-item.done { opacity: 0.6; }
  .task-item.done .task-text { text-decoration: line-through; color: var(--text3); }

  .task-cb {
    width: 20px; height: 20px; border-radius: 6px;
    border: 2px solid var(--border); flex-shrink: 0;
    background: transparent; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; margin-top: 1px;
  }

  .task-item.done .task-cb {
    background: var(--accent); border-color: var(--accent);
  }

  .task-cb svg { opacity: 0; transition: opacity 0.2s; }
  .task-item.done .task-cb svg { opacity: 1; }

  .task-text { font-size: 0.85rem; color: var(--text); line-height: 1.5; }
  .task-text strong { color: var(--accent2); }

  .task-day {
    font-size: 0.7rem; font-weight: 700; color: var(--text3);
    background: var(--bg3); padding: 0.15rem 0.5rem; border-radius: 4px;
    flex-shrink: 0; margin-top: 2px;
  }

  /* ─── ACCORDION ─── */
  .accordion { display: flex; flex-direction: column; gap: 0.75rem; }

  .acc-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    transition: border-color 0.2s;
  }

  .acc-item:hover { border-color: rgba(99,102,241,0.3); }
  .acc-item.open { border-color: rgba(99,102,241,0.4); }

  .acc-trigger {
    width: 100%; padding: 1.1rem 1.25rem;
    display: flex; align-items: center; gap: 1rem;
    cursor: pointer; background: none; border: none;
    text-align: left;
  }

  .acc-num {
    width: 28px; height: 28px; border-radius: 8px;
    background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800; color: var(--accent2);
    flex-shrink: 0;
  }

  .acc-cat {
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 20px;
    flex-shrink: 0;
  }

  .acc-cat.tech { background: rgba(99,102,241,0.1); color: var(--accent2); }
  .acc-cat.system { background: rgba(34,197,94,0.1); color: var(--green); }
  .acc-cat.behavioral { background: rgba(234,179,8,0.1); color: var(--yellow); }
  .acc-cat.company { background: rgba(239,68,68,0.1); color: #fca5a5; }

  .acc-q { font-size: 0.88rem; font-weight: 600; color: var(--text); flex: 1; }

  .acc-icon {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg2); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform 0.3s, background 0.2s;
    color: var(--text2);
  }

  .acc-item.open .acc-icon { transform: rotate(180deg); background: var(--accent); color: white; }

  .acc-body {
    max-height: 0; overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .acc-content {
    padding: 0 1.25rem 1.25rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }

  .hint-box {
    background: rgba(99,102,241,0.06);
    border: 1px solid rgba(99,102,241,0.15);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 1rem 1.25rem;
  }

  .hint-label {
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent2); margin-bottom: 0.6rem;
  }

  .hint-text { font-size: 0.83rem; color: var(--text2); line-height: 1.65; }
  .hint-text strong { color: var(--accent2); }

  /* ─── COVER LETTER ─── */
  .cover-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px; overflow: hidden;
  }

  .cover-header {
    padding: 1.5rem 2rem;
    background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(79,70,229,0.05));
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem;
  }

  .cover-meta { display: flex; flex-direction: column; gap: 0.25rem; }
  .cover-to { font-size: 0.75rem; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .cover-company { font-size: 1.1rem; font-weight: 800; color: var(--text); }
  .cover-role { font-size: 0.85rem; color: var(--accent2); font-weight: 500; }

  .cover-from { text-align: right; }
  .cover-name { font-size: 1rem; font-weight: 700; color: var(--text); }
  .cover-github { font-size: 0.78rem; color: var(--accent2); text-decoration: none; display: flex; align-items: center; gap: 0.3rem; justify-content: flex-end; }
  .cover-github:hover { text-decoration: underline; }

  .cover-body { padding: 2rem; }

  .cover-para {
    font-size: 0.88rem; line-height: 1.8; color: var(--text2);
    margin-bottom: 1.25rem;
  }

  .cover-para:last-child { margin-bottom: 0; }

  .cover-para strong { color: var(--text); }

  .cover-sig {
    margin-top: 1.75rem; padding-top: 1.25rem;
    border-top: 1px solid var(--border);
  }

  .cover-sig p { font-size: 0.85rem; color: var(--text2); margin-bottom: 0.3rem; }
  .cover-sig strong { font-size: 1rem; font-weight: 800; color: var(--text); }

  .copy-btn {
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--text2); font-size: 0.78rem; font-weight: 600;
    padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .copy-btn.copied { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: var(--green); }

  /* ─── PROJECTS ─── */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; }

  .project-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.5rem;
    position: relative; overflow: hidden;
    transition: all 0.3s;
  }

  .project-card:hover {
    border-color: rgba(99,102,241,0.4);
    transform: translateY(-4px);
    box-shadow: 0 25px 60px rgba(99,102,241,0.12);
  }

  .project-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
  }

  .project-card.gold::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .project-card.silver::before { background: linear-gradient(90deg, #94a3b8, #cbd5e1); }
  .project-card.bronze::before { background: linear-gradient(90deg, #c2410c, #f97316); }

  .project-medal { font-size: 1.5rem; margin-bottom: 0.75rem; display: block; }

  .project-name {
    font-size: 1rem; font-weight: 800; color: var(--text);
    margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;
  }

  .project-tag {
    font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 4px;
    background: rgba(99,102,241,0.15); color: var(--accent2);
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  .project-why {
    font-size: 0.78rem; color: var(--text3); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem;
  }

  .project-desc { font-size: 0.83rem; color: var(--text2); line-height: 1.6; margin-bottom: 1rem; }

  .project-pitch {
    background: rgba(99,102,241,0.06); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 0.75rem 1rem;
    font-size: 0.8rem; color: var(--text2); line-height: 1.55;
    font-style: italic;
  }

  .project-actions {
    display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;
  }

  .action-chip {
    font-size: 0.72rem; font-weight: 600;
    padding: 0.3rem 0.7rem; border-radius: 6px;
    background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
    color: #fca5a5;
  }

  /* ─── COMPANY INSIGHTS ─── */
  .insights
