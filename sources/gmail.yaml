name: gmail
version: 0.1.0
dsl_version: 3

backend: http

inputs:
  GOOGLE_OAUTH_CLIENT_ID:
    kind: variable

  GOOGLE_OAUTH_CLIENT_SECRET:
    kind: secret

  GMAIL_TOKEN:
    kind: secret
    credential:
      methods:
        - type: oauth
          label: Connect Gmail
          oauth:
            flow:
              type: authorization_code
              pkce: required

            redirect_uri: http://127.0.0.1:0/oauth/callback
            redirect_uri_port_mode: random

            endpoints:
              authorization_url: https://accounts.google.com/o/oauth2/v2/auth
              token_url: https://oauth2.googleapis.com/token

            client:
              id:
                input: GOOGLE_OAUTH_CLIENT_ID

              secret:
                input: GOOGLE_OAUTH_CLIENT_SECRET
                transport: request_body

            scopes:
              scope:
                delimiter: space
                values:
                  - https://www.googleapis.com/auth/gmail.readonly

base_url: https://gmail.googleapis.com/gmail/v1

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.GMAIL_TOKEN}}

tables:
  - name: messages
    description: Gmail messages

    request:
      method: GET
      path: /users/me/messages

    response:
      rows_path:
        - messages

    columns:
      - name: id
        type: Utf8

      - name: threadId
        type: Utf8

  - name: message_details
    description: Gmail message details

    request:
      method: GET
      path: /users/me/messages/19e79b5fe4100c86

    columns:
      - name: id
        type: Utf8

      - name: threadId
        type: Utf8

      - name: snippet
        type: Utf8

      - name: labelIds
        type: Json

      - name: internalDate
        type: Utf8
